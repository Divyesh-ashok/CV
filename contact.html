<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Divyesh Ashok</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <header class="header fade-in">
        <nav>
            <div class="logo"><a href="index.html" class="hover-target">DIVI</a></div>
            <ul class="nav-links">
                <li><a href="index.html#about" class="hover-target">About</a></li>
                <li><a href="index.html#education" class="hover-target">Education</a></li>
                <li><a href="index.html#experience" class="hover-target">Experience</a></li>
                <li><a href="contact.html" class="hover-target">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="lenis-container">
        <section class="section fade-in" style="padding-top: 150px; min-height: 100vh;">
            <h1 class="section-title">Get in touch</h1>

            <div class="contact-grid">
                <div>
                    <h2 style="font-size: 2rem; margin-bottom: 2rem;">Contact Info</h2>
                    <ul class="hobbies-list" style="margin-bottom: 3rem;">
                        <li><strong>Email:</strong> <a href="mailto:divyeshashok004@gmail.com" class="hover-target inline-link">divyeshashok004@gmail.com</a></li>
                        <li><strong>Phone:</strong> +91 9961181333</li>
                    </ul>
                    <img src="images/web1.jpg" alt="Divyesh" style="width: 100%; max-width: 400px; border-radius: 4px; object-fit: cover;">
                </div>

                <div>
                    <h2 style="font-size: 2rem; margin-bottom: 2rem;">Send a Message</h2>
                    <form action="mailto:divyeshashok004@gmail.com" method="post" enctype="text/plain" class="contact-form">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="Name" class="hover-target" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="E-mail" class="hover-target" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="Message" rows="5" class="hover-target" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn hover-target">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Lenis for smooth scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
